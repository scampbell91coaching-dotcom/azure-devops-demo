apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-web-prod
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web-prod-flask-app
                port:
                  number: 80
