apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-web-prod
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/x-content-type-options: "nosniff"
    nginx.ingress.kubernetes.io/x-frame-options: "DENY"
    nginx.ingress.kubernetes.io/referrer-policy: "strict-origin-when-cross-origin"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - traditionalstrength.co.uk
        - www.traditionalstrength.co.uk
      secretName: traditionalstrength-tls
  rules:
    - host: traditionalstrength.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web-prod-flask-app
                port:
                  number: 80
    - host: www.traditionalstrength.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web-prod-flask-app
                port:
                  number: 80
