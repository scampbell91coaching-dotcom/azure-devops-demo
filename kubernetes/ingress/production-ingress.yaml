apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-web-prod
  namespace: production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - traditionalstrength.co.uk
        - www.traditionalstrength.co.uk
      secretName: traditionalstrength-tls
  rules:
    - host: traditionalstrength.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web-prod-flask-app
                port:
                  number: 80
    - host: www.traditionalstrength.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-web-prod-flask-app
                port:
                  number: 80
