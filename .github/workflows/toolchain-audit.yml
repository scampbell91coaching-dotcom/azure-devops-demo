name: Toolchain Audit

on:
  pull_request:
    paths:
      - ".python-version"
      - ".terraform-version"
      - ".nvmrc"
      - ".toolchain-versions.env"
      - "renovate.json5"
      - ".github/workflows/toolchain-audit.yml"
      - ".github/workflows/toolchain-updates.yml"

  workflow_dispatch:

  schedule:
    - cron: "30 19 * * 2"

permissions:
  contents: read

jobs:
  validate:
    name: Validate pinned toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          source .toolchain-versions.env

          {
            echo "python=$(tr -d '[:space:]' < .python-version)"
            echo "terraform=$(tr -d '[:space:]' < .terraform-version)"
            echo "node=$(tr -d '[:space:]' < .nvmrc)"
            echo "helm=${HELM_VERSION}"
            echo "trivy=${TRIVY_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ steps.versions.outputs.python }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ steps.versions.outputs.terraform }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v${{ steps.versions.outputs.helm }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v${{ steps.versions.outputs.trivy }}
          cache: true

      - name: Report installed versions
        shell: bash
        run: |
          set -euo pipefail

          python --version
          node --version
          npm --version
          terraform version
          helm version --short
          trivy version
