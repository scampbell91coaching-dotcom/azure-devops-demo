name: Azure PostgreSQL plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/modules/postgresql/**"
      - "infra/modules/network/**"
      - "infra/postgresql.tf"
      - "infra/main.tf"
      - "infra/variables.tf"
      - "infra/outputs.tf"
      - "infra/environments/**/postgresql.tfvars.example"
      - "docs/azure-postgresql.md"
      - ".github/workflows/postgresql-plan.yml"
  workflow_dispatch:
    inputs:
      server_name:
        description: "Globally unique development PostgreSQL server name"
        required: true
        type: string
      key_vault_name:
        description: "Existing development Key Vault name"
        required: true
        type: string

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialise without remote state
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: python -m pip install checkov==3.3.8

      - name: Scan PostgreSQL module
        run: checkov --directory infra/modules/postgresql --framework terraform --compact --quiet --skip-download

  plan:
    name: Development plan only
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise development state
        working-directory: infra
        run: terraform init -backend-config=environments/dev/backend.hcl

      - name: Create PostgreSQL development plan
        working-directory: infra
        env:
          TF_VAR_postgresql_server_name: ${{ inputs.server_name }}
          TF_VAR_key_vault_name: ${{ inputs.key_vault_name }}
        run: |
          terraform plan \
            -var-file=environments/dev/terraform.tfvars \
            -var=postgresql_enabled=true \
            -no-color

      - name: Confirm plan-only boundary
        run: echo "This workflow never saves a binary plan or runs terraform apply."
