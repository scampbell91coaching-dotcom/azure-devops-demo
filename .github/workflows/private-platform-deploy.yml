name: Private Platform CI/CD

on:
  push:
    branches: [main]
    paths:
      - "platform-portal/**"
      - "private-platform-manifests/**"
      - "argocd-applications/platform-portal-private.yaml"
      - "argocd-applications/external-secrets-production.yaml"
      - "kubernetes/external-secrets/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "pytest.ini"
      - "scripts/gitops/**"
      - ".github/workflows/private-platform-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform-portal/**"
      - "private-platform-manifests/**"
      - "argocd-applications/platform-portal-private.yaml"
      - "argocd-applications/external-secrets-production.yaml"
      - "kubernetes/external-secrets/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "pytest.ini"
      - "scripts/gitops/**"
      - ".github/workflows/private-platform-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_NAME: stevedevopslab6280
  ACR_LOGIN_SERVER: stevedevopslab6280.azurecr.io
  IMAGE_NAME: platform-portal-private
  MANIFEST: private-platform-manifests/private-platform.yaml
  NAMESPACE: production
  DEPLOYMENT: platform-portal-private
  APP_URL: https://platform.traditionalstrength.co.uk

jobs:
  validate-and-test:
    name: Validate, pytest and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: platform-portal/requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r platform-portal/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Validate private manifests
        run: |
          set -euo pipefail

          mapfile -t manifest_files < <(
            find private-platform-manifests               -maxdepth 1               -type f               -name '*.yaml'               -print |
            sort
          )

          manifest_files+=(
            "argocd-applications/platform-portal-private.yaml"
          )

          docker_args=()

          for file in "${manifest_files[@]}"; do
            docker_args+=("/work/${file}")
          done

          docker run --rm             -v "$PWD:/work"             ghcr.io/yannh/kubeconform:v0.7.0             -strict             -summary             -ignore-missing-schemas             "${docker_args[@]}"

          test "$(
            grep -c               'image: stevedevopslab6280.azurecr.io/platform-portal-private:'               "$MANIFEST"
          )" -eq 2
          test "$(
            grep -c 'image: stevedevopslab6280.azurecr.io/platform-portal-private:' \
              private-platform-manifests/platform-status-collector.yaml
          )" -eq 1

          test "$(grep -c 'name: DATABASE_URL' "$MANIFEST")" -eq 2
          grep -q 'name: flask-runtime-secrets' "$MANIFEST"
          grep -q 'name: flask-migration-secrets' "$MANIFEST"
          grep -q 'name: SECRET_KEY' "$MANIFEST"

      - name: Run private application tests
        run: pytest -q platform-portal/tests

      - name: Run current browser coverage
        env:
          E2E_TEST_ONLY: "1"
        run: npm run e2e

      - name: Confirm non-main release boundary
        if: github.ref != 'refs/heads/main'
        run: echo "Pull requests and feature branches validate only; they cannot publish or promote."

  build-scan-push:
    name: Build, scan and conditionally publish
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set immutable image name
        id: meta
        run: echo "image=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build private portal image
        run: |
          docker build \
            --file platform-portal/Dockerfile.private \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${{ steps.meta.outputs.image }}" \
            platform-portal

      - uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.70.0
          cache: true

      - name: Blocking HIGH and CRITICAL image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate non-blocking SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          image-ref: ${{ steps.meta.outputs.image }}
          scanners: vuln
          format: sarif
          output: trivy-private-platform.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false

      - name: Upload SARIF artifact
        if: always() && hashFiles('trivy-private-platform.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-private-platform-sarif
          path: trivy-private-platform.sarif
          retention-days: 14

      - name: Azure login with OIDC
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: az acr login --name "$ACR_NAME"

      - name: Push immutable image with retries
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker push "${{ steps.meta.outputs.image }}"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done

  promote:
    name: Promote private image through GitOps
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    outputs:
      image: ${{ needs.build-scan-push.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Commit private GitOps promotion safely
        env:
          EXPECTED_IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          set -euo pipefail
          python scripts/gitops/promote_image.py \
            private-platform "$EXPECTED_IMAGE" \
            "chore(gitops): promote private platform ${GITHUB_SHA::7} [skip ci]"

  verify:
    name: Verify Argo CD reconciled private image
    needs: promote
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Azure login with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify image, rollout, database and internal health through Azure
        env:
          EXPECTED_IMAGE: ${{ needs.promote.outputs.image }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_IMAGE"
          test -n "$AKS_RESOURCE_GROUP"
          test -n "$AKS_CLUSTER_NAME"
          for attempt in 1 2 3 4 5; do
            if az aks command invoke \
              --resource-group "$AKS_RESOURCE_GROUP" \
              --name "$AKS_CLUSTER_NAME" \
              --command "set -eu
                portal_image=\$(kubectl get deployment '$DEPLOYMENT' -n '$NAMESPACE' -o jsonpath='{.spec.template.spec.containers[?(@.name==\"portal\")].image}')
                test \"\$portal_image\" = '$EXPECTED_IMAGE'
                kubectl rollout status deployment/'$DEPLOYMENT' -n '$NAMESPACE' --timeout=5m
                pod=\$(kubectl get pod -n '$NAMESPACE' -l app='$DEPLOYMENT' -o jsonpath='{.items[0].metadata.name}')
                kubectl exec -n '$NAMESPACE' \"\$pod\" -c portal -- flask verify-production-db
                kubectl exec -n '$NAMESPACE' \"\$pod\" -c portal -- python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

      - name: Verify authenticated edge remains protected
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "${APP_URL}/health")"
          test "$status" = "302"
          echo "Private health route is reachable and correctly redirects anonymous requests to OAuth2 authentication."
