name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_api_server_authorized_ip_ranges: '[]'

jobs:
  quality:
    name: Terraform quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Initialise root without backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate root Terraform
        working-directory: infra
        run: terraform validate

      - name: Initialise AKS without backend
        working-directory: infra/aks
        run: terraform init -backend=false

      - name: Validate AKS Terraform
        working-directory: infra/aks
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory infra \
            --framework terraform \
            --var-file infra/aks/environments/dev/terraform.tfvars \
            --evaluate-variables true \
            --compact \
            --quiet

  root-plan:
    name: Root infrastructure plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise root Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Plan root infrastructure
        working-directory: infra
        run: |
          terraform plan \
            -var-file=environments/dev/terraform.tfvars \
            -out=root.tfplan

      - name: Upload root plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-terraform-plan
          path: infra/root.tfplan
          retention-days: 1

  aks-plan:
    name: AKS infrastructure plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise AKS Terraform
        working-directory: infra/aks
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Plan AKS infrastructure
        working-directory: infra/aks
        run: |
          terraform plan \
            -var-file=environments/dev/terraform.tfvars \
            -out=aks.tfplan

      - name: Upload AKS plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aks-terraform-plan
          path: infra/aks/aks.tfplan
          retention-days: 1

  root-apply:
    name: Root infrastructure apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: root-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise root Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Download root plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: root-terraform-plan
          path: infra

      - name: Apply root infrastructure
        working-directory: infra
        run: terraform apply -auto-approve root.tfplan

  aks-apply:
    name: AKS infrastructure apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - root-apply
      - aks-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise AKS Terraform
        working-directory: infra/aks
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Download AKS plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aks-terraform-plan
          path: infra/aks

      - name: Apply AKS infrastructure
        working-directory: infra/aks
        run: terraform apply -auto-approve aks.tfplan
