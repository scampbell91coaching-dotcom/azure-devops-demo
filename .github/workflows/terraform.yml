name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_api_server_authorized_ip_ranges: '[]'

jobs:
  quality:
    name: Terraform quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Initialise root without backend
        working-directory: infra
        run: terraform init -backend=false

      - name: Validate root Terraform
        working-directory: infra
        run: terraform validate

      - name: Initialise AKS without backend
        working-directory: infra/aks
        run: terraform init -backend=false

      - name: Validate AKS Terraform
        working-directory: infra/aks
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Checkov
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory infra \
            --framework terraform \
            --var-file infra/aks/environments/dev/terraform.tfvars \
            --evaluate-variables true \
            --compact \
            --quiet

  root-plan:
    name: Root infrastructure plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise root Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Plan root infrastructure
        working-directory: infra
        run: |
          terraform plan \
            -var-file=environments/dev/terraform.tfvars \
            -var=postgresql_enabled=true \
            -out=root.tfplan

      - name: Upload root plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: root-terraform-plan
          path: infra/root.tfplan
          retention-days: 1

  aks-plan:
    name: AKS infrastructure plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise AKS Terraform
        working-directory: infra/aks
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Plan AKS infrastructure
        working-directory: infra/aks
        run: |
          terraform plan \
            -var-file=environments/dev/terraform.tfvars \
            -out=aks.tfplan

      - name: Upload AKS plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aks-terraform-plan
          path: infra/aks/aks.tfplan
          retention-days: 1

  root-apply:
    name: Root infrastructure apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: root-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise root Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Download root plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: root-terraform-plan
          path: infra

      - name: Apply root infrastructure
        working-directory: infra
        run: terraform apply -auto-approve root.tfplan

  aks-apply:
    name: AKS infrastructure apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - root-apply
      - aks-plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialise AKS Terraform
        working-directory: infra/aks
        run: |
          terraform init \
            -backend-config=environments/dev/backend.hcl

      - name: Download AKS plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aks-terraform-plan
          path: infra/aks

      - name: Apply AKS infrastructure
        working-directory: infra/aks
        run: terraform apply -auto-approve aks.tfplan
