name: Browser tests

on:
  pull_request:
    paths:
      - "platform-portal/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/browser-tests.yml"
  push:
    branches: [main]
    paths:
      - "platform-portal/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright release suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: platform-portal/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r platform-portal/requirements.txt
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser tests
        env:
          E2E_TEST_ONLY: "1"
        run: npm run e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            .tmp/playwright-test-results/
          retention-days: 7
