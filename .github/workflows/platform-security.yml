name: Platform Security

on:
  pull_request:
    paths:
      - "flask-app/**"
      - "kubernetes/**"
      - "infra/**"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/platform-security.yml"
  push:
    branches: [main]
    paths:
      - "flask-app/**"
      - "kubernetes/**"
      - "infra/**"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/platform-security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint flask-app -f flask-app/values-production.yaml

      - name: Validate proposed observability resources
        run: scripts/validate-observability.sh

      - name: Render production chart
        run: |
          helm template flask-web-prod flask-app \
            -f flask-app/values-production.yaml \
            > /tmp/flask-production.yaml

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import pathlib
          files = list(pathlib.Path("kubernetes").rglob("*.yaml"))
          files.append(pathlib.Path("/tmp/flask-production.yaml"))
          assert files
          print(f"Validated presence of {len(files)} YAML files")
          PY

      - name: Diagnose repository vulnerabilities and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          skip-dirs: .git,.venv,node_modules,test-results,evidence,.tmp

      - name: Scan repository for GitHub code scanning
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: .git,.venv,node_modules,test-results,evidence,.tmp
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: repository-sbom
          path: sbom.spdx.json
          retention-days: 14

      - name: Enforce Trivy result
        if: always() && steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy reported HIGH or CRITICAL findings; failing the job after publishing security outputs."
          exit 1
