name: Platform Security

on:
  pull_request:
    paths:
      - "flask-app/**"
      - "kubernetes/**"
      - "argocd-applications/external-secrets-production.yaml"
      - "infra/**"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/platform-security.yml"
      - "scripts/platform/check-no-keepass-files.sh"
      - "scripts/validate-observability.sh"
      - "tests/prometheus/**"
      - ".toolchain-versions.env"
      - "**/*.kdbx"
      - "**/*.kdbx.lock"
  push:
    branches: [main]
    paths:
      - "flask-app/**"
      - "kubernetes/**"
      - "argocd-applications/external-secrets-production.yaml"
      - "infra/**"
      - "Dockerfile"
      - "requirements*.txt"
      - ".github/workflows/platform-security.yml"
      - "scripts/platform/check-no-keepass-files.sh"
      - "scripts/validate-observability.sh"
      - "tests/prometheus/**"
      - ".toolchain-versions.env"
      - "**/*.kdbx"
      - "**/*.kdbx.lock"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reject tracked KeePass files
        run: scripts/platform/check-no-keepass-files.sh

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310

      - name: Helm lint
        run: helm lint flask-app -f flask-app/values-production.yaml

      - name: Install pinned promtool
        shell: bash
        run: |
          set -euo pipefail
          source .toolchain-versions.env
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl --fail --location --retry 3 \
            --output "/tmp/${archive}" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_LINUX_AMD64_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${archive}" --directory /tmp \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          mkdir -p "$RUNNER_TEMP/promtool-bin"
          install "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" "$RUNNER_TEMP/promtool-bin/promtool"
          echo "$RUNNER_TEMP/promtool-bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/promtool-bin:$PATH"
          promtool --version

      - name: Validate proposed observability resources (blocking PromQL gate)
        env:
          REQUIRE_PROMTOOL: "true"
        run: scripts/validate-observability.sh

      - name: Render production chart
        run: |
          helm template flask-web-prod flask-app \
            --namespace production \
            -f flask-app/values-production.yaml \
            > /tmp/flask-production.yaml

      - name: Validate Kubernetes YAML
        run: |
          python - <<'PY'
          import pathlib
          files = list(pathlib.Path("kubernetes").rglob("*.yaml"))
          files.append(pathlib.Path("/tmp/flask-production.yaml"))
          assert files
          print(f"Validated presence of {len(files)} YAML files")
          PY

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.70.0
          cache: true

      - name: Scan repository, secrets and IaC (blocking)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          skip-setup-trivy: true
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules,.venv,.terraform,__pycache__,playwright-report,test-results

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          skip-setup-trivy: false
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          skip-dirs: node_modules,.venv,.terraform,__pycache__,playwright-report,test-results

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: trivy-results.sarif

      - name: Generate repository SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-sbom
          path: sbom.spdx.json
          retention-days: 14
