name: Lead Magnets Deploy

on:
  push:
    branches:
      - main
    paths:
      - "platform-portal/**"
      - "lead-magnets-chart/**"
      - ".github/workflows/lead-magnets-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: stevedevopslab6280.azurecr.io
  IMAGE_NAME: lead-magnets

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Azure login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build image
        working-directory: platform-portal
        run: |
          set -euo pipefail

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            -f Dockerfile.public \
            -t "$IMAGE" \
            .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Scan image with Trivy (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

          skip-setup-trivy: true
      - name: Generate image scan SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-lead-magnets-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

          skip-setup-trivy: true
      - name: Upload image scan SARIF
        if: always() && hashFiles('trivy-lead-magnets-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-lead-magnets-sarif
          path: trivy-lead-magnets-results.sarif
          retention-days: 14

      - name: Push image
        working-directory: platform-portal
        run: |
          set -euo pipefail

          IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "$IMAGE"

      - name: Update GitOps image tag
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("lead-magnets-chart/values.yaml")
          text = path.read_text()

          text = re.sub(
              r"(?m)^  tag: .+$",
              f"  tag: {os.environ['GITHUB_SHA']}",
              text,
              count=1,
          )

          path.write_text(text)
          PY

      - name: Commit GitOps update
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lead-magnets-chart/values.yaml

          if git diff --cached --quiet; then
            echo "No values change required."
            exit 0
          fi

          git commit -m "chore(lead-magnets): deploy ${GITHUB_SHA::7}"
          git push
