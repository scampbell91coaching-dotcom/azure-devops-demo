name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/codeql.yml"

  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - ".github/workflows/codeql.yml"

  schedule:
    - cron: "27 4 * * 1"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialise CodeQL
        uses: github/codeql-action/init@b611370bb5703a7efb587f9c9d136a0bb02c5e5a
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b611370bb5703a7efb587f9c9d136a0bb02c5e5a
        with:
          category: "/language:python"
