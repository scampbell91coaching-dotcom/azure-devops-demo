name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "platform-portal/**"
      - "tests/**"
      - "Dockerfile"
      - "pytest.ini"
      - ".dockerignore"
      - "flask-app/**"
      - ".github/workflows/app-deploy.yml"

  pull_request:
    paths:
      - "app/**"
      - "platform-portal/**"
      - "tests/**"
      - "Dockerfile"
      - "pytest.ini"
      - ".dockerignore"
      - "flask-app/**"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub deployment environment (main branch releases only)"
        required: true
        default: production
        type: string
      namespace:
        description: "Existing Kubernetes namespace (main branch releases only)"
        required: true
        default: production
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: application-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_NAME: stevedevopslab6280
  ACR_LOGIN_SERVER: stevedevopslab6280.azurecr.io
  IMAGE_NAME: flask-web
  VALUES_FILE: flask-app/values-production.yaml
  APP_URL: https://traditionalstrength.co.uk
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  K8S_NAMESPACE: ${{ inputs.namespace || 'production' }}

jobs:
  validate-release:
    name: Validate release manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint and render cutover and scale-out modes
        run: |
          set -euo pipefail

          helm lint flask-app -f "$VALUES_FILE"
          helm template flask-web-prod flask-app \
            --namespace "$K8S_NAMESPACE" \
            -f "$VALUES_FILE" \
            --set-string image.tag="$GITHUB_SHA" \
            > /tmp/flask-cutover.yaml

          helm lint flask-app \
            -f "$VALUES_FILE" \
            -f flask-app/values-scale-out.yaml
          helm template flask-web-prod flask-app \
            --namespace "$K8S_NAMESPACE" \
            -f "$VALUES_FILE" \
            -f flask-app/values-scale-out.yaml \
            --set-string image.tag="$GITHUB_SHA" \
            > /tmp/flask-scale-out.yaml

          test -s /tmp/flask-cutover.yaml
          test -s /tmp/flask-scale-out.yaml
          grep -q 'kind: Job' /tmp/flask-cutover.yaml
          grep -q 'name: DATABASE_URL' /tmp/flask-cutover.yaml
          grep -q 'replicas: 1' /tmp/flask-cutover.yaml

      - name: Confirm feature-branch validation boundary
        if: github.ref != 'refs/heads/main'
        run: echo "Feature branches validate, build and scan only; they never publish or promote."

  test:
    name: Test application
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform-portal/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r platform-portal/requirements.txt

      - name: Run tests
        run: |
          set -euo pipefail
          pytest -v platform-portal/tests

  build-and-push:
    name: Build, scan and publish image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.full_sha_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          {
            echo "image_tag=${GITHUB_SHA}"
            echo "sha_tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${SHORT_SHA}"
            echo "full_sha_tag=${FULL_IMAGE}"
            echo "latest_tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.full_sha_tag }}" \
            platform-portal

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.full_sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Azure Login
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR token
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: acr
        run: |
          set -euo pipefail

          TOKEN=$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            --output tsv)

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Push images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          docker push "${{ steps.meta.outputs.sha_tag }}"
          docker push "${{ steps.meta.outputs.full_sha_tag }}"

          docker tag \
            "${{ steps.meta.outputs.full_sha_tag }}" \
            "${{ steps.meta.outputs.latest_tag }}"

          docker push "${{ steps.meta.outputs.latest_tag }}"

  promote:
    name: Promote image through GitOps
    needs: build-and-push
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write

    outputs:
      image: ${{ needs.build-and-push.outputs.image }}

    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update production image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          values_file = Path("flask-app/values-production.yaml")
          image_tag = os.environ["IMAGE_TAG"]

          lines = values_file.read_text().splitlines()
          updated = []
          inside_image = False
          tag_updated = False

          for line in lines:
              if line == "image:":
                  inside_image = True
                  updated.append(line)
                  continue

              if inside_image and line and not line.startswith((" ", "\t")):
                  inside_image = False

              if inside_image and line.lstrip().startswith("tag:"):
                  indentation = line[:len(line) - len(line.lstrip())]
                  updated.append(f"{indentation}tag: {image_tag}")
                  tag_updated = True
              else:
                  updated.append(line)

          if not tag_updated:
              raise RuntimeError(
                  f"Unable to locate image.tag in {values_file}"
              )

          values_file.write_text("\n".join(updated) + "\n")
          PY

          echo "Updated production image configuration:"
          grep -A3 '^image:' "$VALUES_FILE"

      - name: Commit GitOps promotion
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "Production values already reference ${IMAGE_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"

          git commit \
            -m "chore(gitops): promote flask-web ${IMAGE_TAG::7} [skip ci]"

          git push origin HEAD:main

      - name: Show promoted image
        run: |
          set -euo pipefail

          echo "Promoted image:"
          echo "${{ needs.build-and-push.outputs.image }}"

          echo "Argo CD will reconcile the committed Helm values automatically."

  smoke-test:
    name: Verify GitOps deployment
    needs: promote
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS access
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          test -n "$AKS_RESOURCE_GROUP"
          test -n "$AKS_CLUSTER_NAME"
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Wait for migration-gated rollout
        env:
          EXPECTED_IMAGE: ${{ needs.promote.outputs.image }}
        run: |
          set -euo pipefail

          echo "Waiting for Argo CD. Its Helm pre-upgrade migration must succeed before the Deployment changes."
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            current_image=$(kubectl get deployment flask-web \
              --namespace "$K8S_NAMESPACE" \
              --output jsonpath='{.spec.template.spec.containers[0].image}' \
              2>/dev/null || true)
            if [[ "$current_image" == "$EXPECTED_IMAGE" ]]; then
              kubectl rollout status deployment/flask-web \
                --namespace "$K8S_NAMESPACE" \
                --timeout=5m
              exit 0
            fi
            sleep 10
          done

          echo "ERROR: migration-gated rollout did not reach $EXPECTED_IMAGE"
          kubectl get jobs,pods,deployments --namespace "$K8S_NAMESPACE" || true
          kubectl logs job/flask-web-prod-flask-app-migration \
            --namespace "$K8S_NAMESPACE" || true
          exit 1

      - name: Wait for production health endpoint
        run: |
          set -euo pipefail

          HEALTH_URL="${APP_URL}/health"

          echo "Waiting for Argo CD to deploy the promoted image."
          echo "Testing: ${HEALTH_URL}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 24 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            "$HEALTH_URL"

          echo
          echo "Production health check passed."
