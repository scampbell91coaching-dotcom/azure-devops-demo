name: Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "platform-portal/**"
      - "tests/**"
      - "Dockerfile"
      - "pytest.ini"
      - ".dockerignore"
      - "flask-app/**"
      - ".github/workflows/app-deploy.yml"

  pull_request:
    paths:
      - "app/**"
      - "platform-portal/**"
      - "tests/**"
      - "Dockerfile"
      - "pytest.ini"
      - ".dockerignore"
      - "flask-app/**"
      - ".github/workflows/app-deploy.yml"

  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub deployment environment (main branch releases only)"
        required: true
        default: production
        type: string
      namespace:
        description: "Existing Kubernetes namespace (main branch releases only)"
        required: true
        default: production
        type: string

permissions:
  contents: read

concurrency:
  group: application-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_NAME: stevedevopslab6280
  ACR_LOGIN_SERVER: stevedevopslab6280.azurecr.io
  IMAGE_NAME: flask-web
  VALUES_FILE: flask-app/values-production.yaml
  APP_URL: https://traditionalstrength.co.uk
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  K8S_NAMESPACE: ${{ inputs.namespace || 'production' }}

jobs:
  validate-release:
    name: Validate release manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.17.3

      - name: Lint and render cutover and scale-out modes
        run: |
          set -euo pipefail

          helm lint flask-app -f "$VALUES_FILE"
          helm template flask-web-prod flask-app \
            --namespace "$K8S_NAMESPACE" \
            -f "$VALUES_FILE" \
            --set-string image.tag="$GITHUB_SHA" \
            > /tmp/flask-cutover.yaml

          helm lint flask-app \
            -f "$VALUES_FILE" \
            -f flask-app/values-scale-out.yaml
          helm template flask-web-prod flask-app \
            --namespace "$K8S_NAMESPACE" \
            -f "$VALUES_FILE" \
            -f flask-app/values-scale-out.yaml \
            --set-string image.tag="$GITHUB_SHA" \
            > /tmp/flask-scale-out.yaml

          test -s /tmp/flask-cutover.yaml
          test -s /tmp/flask-scale-out.yaml
          grep -q 'kind: Job' /tmp/flask-cutover.yaml
          grep -q 'name: DATABASE_URL' /tmp/flask-cutover.yaml
          grep -q 'replicas: 1' /tmp/flask-cutover.yaml

      - name: Confirm feature-branch validation boundary
        if: github.ref != 'refs/heads/main'
        run: echo "Feature branches validate, build and scan only; they never publish or promote."

  test:
    name: Test application
    needs: validate-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform-portal/requirements.txt
            platform-portal/requirements-dev.txt

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r platform-portal/requirements-dev.txt

      - name: Run tests
        run: |
          set -euo pipefail
          pytest -v platform-portal/tests

  build-and-push:
    name: Build, scan and publish image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.full_sha_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Generate image metadata
        id: meta
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA::7}"
          FULL_IMAGE="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"

          {
            echo "image_tag=${GITHUB_SHA}"
            echo "sha_tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${SHORT_SHA}"
            echo "full_sha_tag=${FULL_IMAGE}"
            echo "latest_tag=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          set -euo pipefail

          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.sha_tag }}" \
            -t "${{ steps.meta.outputs.full_sha_tag }}" \
            platform-portal

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.70.0
          cache: true

      - name: Scan image with Trivy (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          scanners: vuln
          image-ref: ${{ steps.meta.outputs.full_sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate image scan SARIF
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          scanners: vuln
          image-ref: ${{ steps.meta.outputs.full_sha_tag }}
          format: sarif
          output: trivy-image-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: false

      - name: Upload image scan SARIF
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 14

      - name: Azure Login
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR token
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: acr
        run: |
          set -euo pipefail

          TOKEN=$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            --output tsv)

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@eed250920367120910219051b8653a1d846f7f03
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Push images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          push_with_retry() {
            local image="$1"

            for attempt in 1 2 3; do
              echo "Pushing ${image} (attempt ${attempt}/3)"

              if docker push "$image"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                delay=$((attempt * 20))
                echo "Push failed; retrying in ${delay}s"
                sleep "$delay"
              fi
            done

            echo "ERROR: failed to push ${image} after 3 attempts"
            return 1
          }

          push_with_retry "${{ steps.meta.outputs.sha_tag }}"
          push_with_retry "${{ steps.meta.outputs.full_sha_tag }}"

          docker tag \
            "${{ steps.meta.outputs.full_sha_tag }}" \
            "${{ steps.meta.outputs.latest_tag }}"

          push_with_retry "${{ steps.meta.outputs.latest_tag }}"

  promote:
    name: Promote image through GitOps
    needs: build-and-push
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write

    outputs:
      image: ${{ needs.build-and-push.outputs.image }}

    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Update production image tag
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          values_file = Path("flask-app/values-production.yaml")
          image_tag = os.environ["IMAGE_TAG"]

          lines = values_file.read_text().splitlines()
          updated = []
          inside_image = False
          tag_updated = False

          for line in lines:
              if line == "image:":
                  inside_image = True
                  updated.append(line)
                  continue

              if inside_image and line and not line.startswith((" ", "\t")):
                  inside_image = False

              if inside_image and line.lstrip().startswith("tag:"):
                  indentation = line[:len(line) - len(line.lstrip())]
                  updated.append(f"{indentation}tag: {image_tag}")
                  tag_updated = True
              else:
                  updated.append(line)

          if not tag_updated:
              raise RuntimeError(
                  f"Unable to locate image.tag in {values_file}"
              )

          values_file.write_text("\n".join(updated) + "\n")
          PY

          echo "Updated production image configuration:"
          grep -A3 '^image:' "$VALUES_FILE"

      - name: Commit GitOps promotion
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "Production values already reference ${IMAGE_TAG}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"

          git commit \
            -m "chore(gitops): promote flask-web ${IMAGE_TAG::7} [skip ci]"

          git push origin HEAD:main

      - name: Show promoted image
        run: |
          set -euo pipefail

          echo "Promoted image:"
          echo "${{ needs.build-and-push.outputs.image }}"

          echo "Argo CD will reconcile the committed Helm values automatically."

  smoke-test:
    name: Verify GitOps deployment
    needs: promote
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure AKS access
        env:
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          test -n "$AKS_RESOURCE_GROUP"
          test -n "$AKS_CLUSTER_NAME"
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Wait for migration-gated rollout
        env:
          EXPECTED_IMAGE: ${{ needs.promote.outputs.image }}
          AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail

          test -n "$EXPECTED_IMAGE"
          test -n "$AKS_RESOURCE_GROUP"
          test -n "$AKS_CLUSTER_NAME"

          echo "Expected image: $EXPECTED_IMAGE"
          echo "Verifying deployment through Azure AKS command invoke."

          for attempt in 1 2 3 4 5; do
            echo "AKS verification attempt ${attempt}/5"

            if result="$(
              az aks command invoke \
                --resource-group "$AKS_RESOURCE_GROUP" \
                --name "$AKS_CLUSTER_NAME" \
                --command "
                  set -eu
                  current_image=\$(kubectl get deployment flask-web \
                    --namespace '$K8S_NAMESPACE' \
                    --output jsonpath='{.spec.template.spec.containers[0].image}')

                  echo \"Expected image: $EXPECTED_IMAGE\"
                  echo \"Observed image: \$current_image\"

                  test \"\$current_image\" = \"$EXPECTED_IMAGE\"

                  kubectl rollout status deployment/flask-web \
                    --namespace '$K8S_NAMESPACE' \
                    --timeout=5m
                " \
                --query logs \
                --output tsv
            )"; then
              printf '%s\n' "$result"
              echo "GitOps deployment verification passed."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: AKS deployment verification failed after 5 attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Verification failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Wait for production health endpoint
        run: |
          set -euo pipefail

          HEALTH_URL="${APP_URL}/health"

          echo "Waiting for Argo CD to deploy the promoted image."
          echo "Testing: ${HEALTH_URL}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 24 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            "$HEALTH_URL"

          echo
          echo "Production health check passed."
