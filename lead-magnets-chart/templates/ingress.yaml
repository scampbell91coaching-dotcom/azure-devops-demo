{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lead-magnets.fullname" . }}
  labels:
    {{- include "lead-magnets.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/x-content-type-options: "nosniff"
    nginx.ingress.kubernetes.io/x-frame-options: "DENY"
    nginx.ingress.kubernetes.io/referrer-policy: "strict-origin-when-cross-origin"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /guides
            pathType: Prefix
            backend:
              service:
                name: {{ include "lead-magnets.fullname" . }}
                port:
                  name: http
          - path: /apply
            pathType: Prefix
            backend:
              service:
                name: {{ include "lead-magnets.fullname" . }}
                port:
                  name: http
          - path: /api/v1/lead-captures
            pathType: Prefix
            backend:
              service:
                name: {{ include "lead-magnets.fullname" . }}
                port:
                  name: http
          - path: /lead-static
            pathType: Prefix
            backend:
              service:
                name: {{ include "lead-magnets.fullname" . }}
                port:
                  name: http
{{- end }}
