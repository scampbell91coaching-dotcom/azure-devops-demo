replicaCount: 1

image:
  repository: stevedevopslab6280.azurecr.io/lead-magnets
  tag: 1afe8c83f1255da18034cad8327f17f2b54ff59e
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 80
  targetPort: 8080

persistence:
  enabled: true
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi

ingress:
  enabled: true
  className: nginx
  host: traditionalstrength.co.uk
  tlsSecretName: traditionalstrength-tls

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true

database:
  path: /data/leads.db
