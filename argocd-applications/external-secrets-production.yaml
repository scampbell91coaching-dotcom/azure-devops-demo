apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/scampbell91coaching-dotcom/azure-devops-demo.git
    targetRevision: main
    path: kubernetes/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
