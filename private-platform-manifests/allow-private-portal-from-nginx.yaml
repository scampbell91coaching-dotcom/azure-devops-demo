apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-portal-from-nginx
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: platform-portal-private
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: production
      ports:
        - protocol: TCP
          port: 8080
