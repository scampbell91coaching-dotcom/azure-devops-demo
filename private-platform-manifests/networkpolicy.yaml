apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-private-platform-ingress
  namespace: production
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - platform-oauth2-proxy
          - platform-portal-private
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: production
      ports:
        - protocol: TCP
          port: 4180
        - protocol: TCP
          port: 8080
