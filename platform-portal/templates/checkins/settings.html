{% extends "coach/base.html" %}
{% set coach_section = "athletes" %}
{% block title %}Check-in Settings{% endblock %}
{% block content %}
<section class="coach-page">
  <header class="coach-page__header">
    <h1>Check-in modules</h1>
    <p>{{ athlete.full_name }}</p>
  </header>

  <form class="coach-panel coach-form" method="post">
    <label>
      <input
        type="checkbox"
        name="workflow_active"
        value="1"
        {% if settings.workflow_active %}checked{% endif %}
      >
      Weekly check-in workflow active
    </label>

    <label>
      <input
        type="checkbox"
        name="training_enabled"
        value="1"
        {% if settings.training_enabled %}checked{% endif %}
      >
      Weekly training check-in
    </label>

    <label>
      <input
        type="checkbox"
        name="nutrition_enabled"
        value="1"
        {% if settings.nutrition_enabled %}checked{% endif %}
      >
      Weekly nutrition check-in
    </label>

    <label>
      <span>Check-in day</span>
      <select name="checkin_day">
        {% for day in range(7) %}
          <option value="{{ day }}" {% if settings.checkin_day == day %}selected{% endif %}>
            {{ ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][day] }}
          </option>
        {% endfor %}
      </select>
    </label>

    <button class="coach-primary-button" type="submit">Save</button>
  </form>
</section>
{% endblock %}
