<section class="guide-section steps-section" id="guide-steps">
  <div class="page-shell">
    <div class="section-heading">
      <span class="eyebrow">{{ content.framework_label }}</span>
      <h2>{{ content.framework_heading }}</h2>
      <p>{{ content.framework_intro }}</p>
    </div>

    <div class="steps-grid">
      {% for step in content.steps %}
        <article class="step-card">
          <span class="step-number">{{ "%02d" | format(loop.index) }}</span>
          <div class="step-card__body">
            <h3>{{ step.title }}</h3>
            <p>{{ step.copy }}</p>

            {% if step.video_url %}
              <a class="text-link" href="{{ step.video_url }}">
                Watch Step
              </a>
            {% endif %}
          </div>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
