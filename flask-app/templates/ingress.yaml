{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.tlsSecretName }}{{ fail "ingress.tlsSecretName is required when ingress is enabled" }}{{ end }}
{{- if empty .Values.ingress.hosts }}{{ fail "ingress.hosts must contain at least one host when ingress is enabled" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ default (include "flask-app.fullname" .) .Values.ingress.nameOverride }}
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/x-content-type-options: "nosniff"
    nginx.ingress.kubernetes.io/x-frame-options: "DENY"
    nginx.ingress.kubernetes.io/referrer-policy: "strict-origin-when-cross-origin"
    # Defense in depth for older images which exposed /metrics without auth.
    # Internal ServiceMonitor traffic goes directly to the ClusterIP Service.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* "^/metrics(?:[/?]|$)") { return 404; }
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        {{- toYaml .Values.ingress.hosts | nindent 8 }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "flask-app.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
