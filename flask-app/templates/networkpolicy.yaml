{{- if .Values.networkPolicy.enabled }}
{{- if and .Values.networkPolicy.allowDatabaseEgress (not .Values.networkPolicy.databaseCidrs) }}
{{- fail "networkPolicy.databaseCidrs must contain at least one private CIDR when database egress is enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flask-app.fullname" . }}-default-deny
spec:
  podSelector:
    matchLabels:
      {{- include "flask-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flask-app.fullname" . }}-allow-required
spec:
  podSelector:
    matchLabels:
      {{- include "flask-app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- if .Values.networkPolicy.allowMonitoring }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - { protocol: TCP, port: 443 }
    {{- end }}
    {{- if .Values.networkPolicy.allowDatabaseEgress }}
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    {{- end }}
{{- end }}
