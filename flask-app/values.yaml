replicaCount: 1

image:
  repository: stevedevopslab6280.azurecr.io/flask-web
  # Use a commit SHA, semantic version, or digest. Mutable tags such as latest are rejected.
  tag: 68e2757f00c726dc02500fa5ccf39444a00d7934
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8090

containerPort: 8090

application:
  message: ""

database:
  # The Secret is created out-of-band (normally by External Secrets). Never put
  # a connection string in a values file or a GitHub Actions input.
  enabled: false
  secretName: flask-runtime-secrets
  secretKey: DATABASE_URL

migration:
  enabled: false
  # Migration credentials are deliberately held in a different Secret from
  # the long-lived web workload. Never put the connection string in values.
  secretName: flask-migration-secrets
  secretKey: DATABASE_URL
  command:
    - flask
    - db
    - upgrade
  backoffLimit: 0
  activeDeadlineSeconds: 600

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60


readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  path: /health
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  readOnlyRootFilesystem: true

ingress:
  nameOverride: ""
  enabled: false
  className: nginx
  hosts: []
  tlsSecretName: ""

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  allowMonitoring: false
  allowHttpsEgress: true
  allowDatabaseEgress: false
  databasePort: 5432
  # Required when database egress is enabled. Use only the private database
  # subnet(s); never use 0.0.0.0/0 for PostgreSQL.
  databaseCidrs: []

topologySpreadConstraints: []

affinity: {}

nodeSelector:
  workload: production

# Proposed production observability resources. Disabled by default so adding the
# definitions cannot create dashboards or live alerts without an explicit review.
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: monitoring
  prometheusRule:
    enabled: true
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
