replicaCount: 1

image:
  repository: stevedevopslab6280.azurecr.io/flask-web
  tag: c69864836193acc31a22d7c5eb288ad5e8481559
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8090

containerPort: 8090

application:
  message: ""

database:
  enabled: true
  secretName: flask-runtime-secrets
  secretKey: DATABASE_URL

migration:
  enabled: true
  command:
    - flask
    - db
    - upgrade
  backoffLimit: 0
  activeDeadlineSeconds: 600

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 512Mi

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  path: /health
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  # Set true only after confirming the application writes nowhere in the image filesystem.
  readOnlyRootFilesystem: false

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: flask-web

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: flask-web
