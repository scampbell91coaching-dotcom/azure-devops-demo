replicaCount: 1

image:
  repository: stevedevopslab6280.azurecr.io/flask-web
  tag: 2c399e3ce50bc3aa5fe5e36ce097b07f81b82f01
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8090

containerPort: 8090

application:
  message: ""

database:
  enabled: true
  secretName: flask-runtime-secrets
  secretKey: DATABASE_URL

migration:
  enabled: true
  command:
    - flask
    - db
    - upgrade
  backoffLimit: 0
  activeDeadlineSeconds: 600

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 512Mi

readinessProbe:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  path: /health
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 2
  failureThreshold: 3

startupProbe:
  path: /health
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 30

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  readOnlyRootFilesystem: true

ingress:
  nameOverride: "flask-web-prod"
  enabled: true
  className: nginx
  hosts:
    - traditionalstrength.co.uk
    - www.traditionalstrength.co.uk
  tlsSecretName: traditionalstrength-tls

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  allowMonitoring: false
  allowHttpsEgress: true
  allowDatabaseEgress: true
  databasePort: 5432

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app: flask-web

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: flask-web

# PROPOSED, NOT ACTIVE: opt in only after confirming the monitoring release
# label and Alertmanager routing described in docs/production-observability.md.
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: monitoring
  prometheusRule:
    enabled: true
    labels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
