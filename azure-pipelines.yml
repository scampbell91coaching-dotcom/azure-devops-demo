trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: stevedevopslab6280
  IMAGE_REPOSITORY: flask-web
  AKS_RESOURCE_GROUP: rg-devops-assessment-lab
  AKS_CLUSTER: aks-devops-lab
  K8S_NAMESPACE: demo
  HELM_RELEASE: flask-web
  CHART_PATH: flask-app
  KEY_VAULT_NAME: stevedevopskv30841

stages:

# =========================================================
# VALIDATE
# =========================================================
- stage: Validate
  displayName: Validate Application and Helm

  jobs:
  - job: Validate
    displayName: Run validation checks

    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: Install Helm
      inputs:
        helmVersionToInstall: latest

    - script: |
        set -euo pipefail

        echo "Helm version:"
        helm version

        echo "Linting Helm chart..."
        helm lint "$(CHART_PATH)"

        echo "Rendering Helm chart..."
        helm template "$(HELM_RELEASE)" "$(CHART_PATH)" \
          --namespace "$(K8S_NAMESPACE)" \
          --set-string image.repository="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)" \
          --set-string image.tag="$(Build.SourceVersion)" \
          > rendered-manifests.yaml

        test -s rendered-manifests.yaml

        echo "Checking rendered manifests for empty critical values..."
        if grep -Eq \
          'containerPort:[[:space:]]*$|targetPort:[[:space:]]*$|timeoutSeconds:[[:space:]]*$|failureThreshold:[[:space:]]*$' \
          rendered-manifests.yaml; then
          echo "ERROR: Rendered manifests contain empty required values."
          exit 1
        fi

        echo "Helm validation completed successfully."
      displayName: Lint and render Helm chart

    - publish: rendered-manifests.yaml
      artifact: rendered-manifests
      displayName: Publish rendered manifests


# =========================================================
# BUILD
# =========================================================
- stage: Build
  displayName: Build and Push Image
  dependsOn: Validate
  condition: succeeded()

  jobs:
  - job: Build
    displayName: Build Docker image

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and push image to ACR
      inputs:
        command: buildAndPush
        containerRegistry: acr-connection
        repository: $(IMAGE_REPOSITORY)
        Dockerfile: Dockerfile
        buildContext: .
        tags: |
          $(Build.SourceVersion)
          latest


# =========================================================
# SECURITY
# =========================================================
- stage: Security
  displayName: Scan Container Image
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: TrivyScan
    displayName: Trivy vulnerability scan

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Sign in to ACR
      inputs:
        command: login
        containerRegistry: acr-connection

    - script: |
        set -euo pipefail

        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        trivy --version
      displayName: Install Trivy

    - script: |
        set -euo pipefail

        IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY):$(Build.SourceVersion)"

        echo "Generating security report for $IMAGE"

        trivy image \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --format table \
          --output trivy-report.txt \
          "$IMAGE"

        cat trivy-report.txt
      displayName: Generate Trivy report

    - publish: trivy-report.txt
      artifact: trivy-security-report
      displayName: Publish Trivy report
      condition: always()

    - script: |
        set -euo pipefail

        IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY):$(Build.SourceVersion)"

        trivy image \
          --scanners vuln \
          --severity CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          --no-progress \
          "$IMAGE"
      displayName: Block fixable critical vulnerabilities


# =========================================================
# DEPLOY DEMO
# =========================================================
- stage: Deploy
  displayName: Deploy to AKS Demo
  dependsOn: Security
  condition: succeeded()

  jobs:
  - deployment: DeployDemo
    displayName: Deploy demo with Helm
    environment: demo

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: Retrieve application secret
            inputs:
              azureSubscription: azure-devops-connection
              KeyVaultName: $(KEY_VAULT_NAME)
              SecretsFilter: flask-demo-message
              RunAsPreJob: false

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.21.2

          - task: AzureCLI@2
            displayName: Helm deploy to demo
            env:
              FLASK_DEMO_MESSAGE: $(flask-demo-message)
            inputs:
              azureSubscription: azure-devops-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER)" \
                  --overwrite-existing

                echo "Deploying release $(HELM_RELEASE) to $(K8S_NAMESPACE)..."

                helm upgrade "$(HELM_RELEASE)" "$(CHART_PATH)" \
                  --install \
                  --namespace "$(K8S_NAMESPACE)" \
                  --create-namespace \
                  --set-string image.repository="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)" \
                  --set-string image.tag="$(Build.SourceVersion)" \
                  --set-string application.message="$FLASK_DEMO_MESSAGE" \
                  --wait \
                  --atomic \
                  --timeout 5m \
                  --history-max 10

                helm status "$(HELM_RELEASE)" \
                  --namespace "$(K8S_NAMESPACE)"


# =========================================================
# VERIFY DEMO
# =========================================================
- stage: Verify
  displayName: Verify Demo Deployment
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: SmokeTest
    displayName: Run demo smoke test

    steps:
    - task: AzureCLI@2
      displayName: Test demo application
      inputs:
        azureSubscription: azure-devops-connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "$(AKS_RESOURCE_GROUP)" \
            --name "$(AKS_CLUSTER)" \
            --overwrite-existing

          kubectl rollout status \
            deployment/$(HELM_RELEASE)-flask-app \
            --namespace "$(K8S_NAMESPACE)" \
            --timeout=180s

          EXTERNAL_IP=""

          for attempt in {1..30}; do
            EXTERNAL_IP=$(kubectl get service \
              "$(HELM_RELEASE)-flask-app" \
              --namespace "$(K8S_NAMESPACE)" \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}' \
              2>/dev/null || true)

            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi

            echo "Waiting for demo external IP: $attempt/30"
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "ERROR: Demo service did not receive an external IP."
            kubectl get all --namespace "$(K8S_NAMESPACE)"
            exit 1
          fi

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://$EXTERNAL_IP/health"; then
              echo
              echo "Demo smoke test passed."
              exit 0
            fi

            echo "Waiting for demo endpoint: $attempt/12"
            sleep 10
          done

          echo "ERROR: Demo smoke test failed."
          kubectl get pods,services,deployments \
            --namespace "$(K8S_NAMESPACE)"
          exit 1


# =========================================================
# DEPLOY PRODUCTION
# =========================================================
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: Verify
  condition: succeeded()

  jobs:
  - deployment: DeployProduction
    displayName: Deploy production with Helm
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: Retrieve application secret
            inputs:
              azureSubscription: azure-devops-connection
              KeyVaultName: $(KEY_VAULT_NAME)
              SecretsFilter: flask-demo-message
              RunAsPreJob: false

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 3.21.2

          - task: AzureCLI@2
            displayName: Helm deploy to production
            env:
              FLASK_DEMO_MESSAGE: $(flask-demo-message)
            inputs:
              azureSubscription: azure-devops-connection
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER)" \
                  --overwrite-existing

                echo "Deploying production release..."

                helm upgrade flask-web-prod "$(CHART_PATH)" \
                  --install \
                  --namespace production \
                  --create-namespace \
                  --values "$(CHART_PATH)/values-production.yaml" \
                  --set-string image.repository="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)" \
                  --set-string image.tag="$(Build.SourceVersion)" \
                  --set-string application.message="$FLASK_DEMO_MESSAGE" \
                  --wait \
                  --atomic \
                  --timeout 5m \
                  --history-max 10

                helm status flask-web-prod \
                  --namespace production


# =========================================================
# VERIFY PRODUCTION
# =========================================================
- stage: VerifyProduction
  displayName: Verify Production
  dependsOn: DeployProduction
  condition: succeeded()

  jobs:
  - job: ProductionSmokeTest
    displayName: Run production smoke test

    steps:
    - task: AzureCLI@2
      displayName: Test production application
      inputs:
        azureSubscription: azure-devops-connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group "$(AKS_RESOURCE_GROUP)" \
            --name "$(AKS_CLUSTER)" \
            --overwrite-existing

          kubectl rollout status \
            deployment/flask-web-prod-flask-app \
            --namespace production \
            --timeout=180s

          EXTERNAL_IP=""

          for attempt in {1..30}; do
            EXTERNAL_IP=$(kubectl get service \
              flask-web-prod-flask-app \
              --namespace production \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}' \
              2>/dev/null || true)

            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi

            echo "Waiting for production external IP: $attempt/30"
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "ERROR: Production service did not receive an external IP."
            kubectl get all --namespace production
            exit 1
          fi

          for attempt in {1..12}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "http://$EXTERNAL_IP/health"; then
              echo
              echo "Production smoke test passed."
              exit 0
            fi

            echo "Waiting for production endpoint: $attempt/12"
            sleep 10
          done

          echo "ERROR: Production smoke test failed."
          kubectl get pods,services,deployments \
            --namespace production
          exit 1
