trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: stevedevopslab6280

stages:

- stage: Build
  displayName: Build & Push Image

  jobs:
  - job: Docker

    steps:

    - task: Docker@2
      displayName: Build and Push Image
      inputs:
        containerRegistry: acr-connection
        repository: flask-web
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          $(Build.SourceVersion)

- stage: Deploy
  displayName: Deploy to AKS

  dependsOn: Build

  jobs:
  - deployment: Deploy

    environment: demo

    strategy:
      runOnce:

        deploy:

          steps:

          - checkout: self

          - task: HelmInstaller@1
            inputs:
              helmVersionToInstall: latest

          - task: HelmDeploy@0
            displayName: Helm Upgrade

            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: azure-devops-connection
              azureResourceGroup: rg-devops-assessment-lab
              kubernetesCluster: aks-devops-lab
              namespace: demo
              command: upgrade
              chartType: FilePath
              chartPath: flask-app
              releaseName: flask-web

              overrideValues: |
                image.repository=$(ACR_NAME).azurecr.io/flask-web
                image.tag=$(Build.SourceVersion)

              install: true
