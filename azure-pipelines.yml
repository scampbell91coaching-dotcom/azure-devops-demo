trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  ACR_NAME: stevedevopslab6280
  IMAGE_REPOSITORY: flask-web
  AKS_RESOURCE_GROUP: rg-devops-assessment-lab
  AKS_CLUSTER: aks-devops-lab
  K8S_NAMESPACE: demo
  HELM_RELEASE: flask-web
  CHART_PATH: flask-app

stages:

# -------------------------
# Validate application/chart
# -------------------------
- stage: Validate
  displayName: Validate Application and Helm

  jobs:
  - job: Validate
    displayName: Run validation checks

    steps:
    - checkout: self

    - task: HelmInstaller@1
      displayName: Install Helm
      inputs:
        helmVersionToInstall: latest

    - script: |
        set -euo pipefail

        echo "Linting Helm chart..."
        helm lint $(CHART_PATH)

        echo "Rendering Helm chart..."
        helm template $(HELM_RELEASE) $(CHART_PATH) \
          --set-string image.repository="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)" \
          --set-string image.tag="$(Build.SourceVersion)" \
          > rendered-manifests.yaml

        echo "Checking for empty critical fields..."
        if grep -Eq 'containerPort:[[:space:]]*$|targetPort:[[:space:]]*$|timeoutSeconds:[[:space:]]*$|failureThreshold:[[:space:]]*$' rendered-manifests.yaml; then
          echo "ERROR: Rendered manifests contain empty required values."
          exit 1
        fi

        echo "Helm validation completed successfully."
      displayName: Lint and render Helm chart

    - publish: rendered-manifests.yaml
      artifact: rendered-manifests
      displayName: Publish rendered manifests

# -------------------------
# Build and push container
# -------------------------
- stage: Build
  displayName: Build and Push Image
  dependsOn: Validate

  jobs:
  - job: Docker
    displayName: Build Docker image

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Build and push image
      inputs:
        containerRegistry: acr-connection
        repository: $(IMAGE_REPOSITORY)
        command: buildAndPush
        Dockerfile: Dockerfile
        tags: |
          $(Build.SourceVersion)
          latest

# -------------------------
# Scan container image
# -------------------------
- stage: Security
  displayName: Scan Container Image
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: TrivyScan
    displayName: Trivy vulnerability scan

    steps:
    - checkout: self

    - task: Docker@2
      displayName: Sign in to ACR
      inputs:
        command: login
        containerRegistry: acr-connection

    - script: |
        set -euo pipefail

        echo "Installing Trivy..."
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key           | gpg --dearmor           | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main"           | sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

        trivy --version
      displayName: Install Trivy

    - script: |
        set -euo pipefail

        IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY):$(Build.SourceVersion)"

        echo "Scanning $IMAGE"

        trivy image           --scanners vuln           --severity HIGH,CRITICAL           --ignore-unfixed           --format table           --output trivy-report.txt           "$IMAGE"

        cat trivy-report.txt
      displayName: Generate Trivy report

    - publish: trivy-report.txt
      artifact: trivy-security-report
      displayName: Publish Trivy report
      condition: always()

    - script: |
        set -euo pipefail

        IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY):$(Build.SourceVersion)"

        echo "Enforcing critical vulnerability policy..."

        trivy image           --scanners vuln           --severity CRITICAL           --ignore-unfixed           --exit-code 1           --no-progress           "$IMAGE"
      displayName: Block fixable critical vulnerabilities

# -------------------------
# Deploy to AKS
# -------------------------
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Security
  condition: succeeded()

  jobs:
  - deployment: Deploy
    displayName: Helm deployment
    environment: demo

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: Retrieve application secrets
            inputs:
              azureSubscription: azure-devops-connection
              KeyVaultName: stevedevopskv30841
              SecretsFilter: flask-demo-message
              RunAsPreJob: false

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: latest

          - task: HelmDeploy@0
            displayName: Helm upgrade
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: azure-devops-connection
              azureResourceGroup: $(AKS_RESOURCE_GROUP)
              kubernetesCluster: $(AKS_CLUSTER)
              namespace: $(K8S_NAMESPACE)
              command: upgrade
              chartType: FilePath
              chartPath: $(CHART_PATH)
              releaseName: $(HELM_RELEASE)
              overrideValues: |
                image.repository=$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)
                image.tag=$(Build.SourceVersion)
                application.message=$(flask-demo-message)
              arguments: >-
                --install
                --atomic
                --wait
                --timeout 5m
                --history-max 10

# -------------------------
# Verify live deployment
# -------------------------
- stage: Verify
  displayName: Verify Deployment
  dependsOn: Deploy
  condition: succeeded()

  jobs:
  - job: SmokeTest
    displayName: Run smoke tests

    steps:
    - task: AzureCLI@2
      displayName: Test deployed application
      inputs:
        azureSubscription: azure-devops-connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group $(AKS_RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          echo "Waiting for deployment rollout..."
          kubectl rollout status \
            deployment/$(HELM_RELEASE)-flask-app \
            --namespace $(K8S_NAMESPACE) \
            --timeout=180s

          echo "Waiting for external IP..."
          EXTERNAL_IP=""

          for attempt in {1..30}; do
            EXTERNAL_IP=$(kubectl get service \
              $(HELM_RELEASE)-flask-app \
              --namespace $(K8S_NAMESPACE) \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi

            echo "External IP not ready. Attempt $attempt/30..."
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "ERROR: Service did not receive an external IP."
            exit 1
          fi

          echo "Testing http://$EXTERNAL_IP/health"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "http://$EXTERNAL_IP/health"; then
              echo
              echo "Smoke test passed."
              exit 0
            fi

            echo "Health endpoint not ready. Attempt $attempt/12..."
            sleep 10
          done

          echo "ERROR: Smoke test failed."
          kubectl get pods,services,deployments \
            --namespace $(K8S_NAMESPACE)
          exit 1

# -------------------------
# Deploy to production
# -------------------------
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: Verify
  condition: succeeded()

  jobs:
  - deployment: DeployProduction
    displayName: Production Helm deployment
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureKeyVault@2
            displayName: Retrieve application secrets
            inputs:
              azureSubscription: azure-devops-connection
              KeyVaultName: stevedevopskv30841
              SecretsFilter: flask-demo-message
              RunAsPreJob: false

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: latest

          - task: HelmDeploy@0
            displayName: Helm upgrade production
            inputs:
              connectionType: Azure Resource Manager
              azureSubscription: azure-devops-connection
              azureResourceGroup: $(AKS_RESOURCE_GROUP)
              kubernetesCluster: $(AKS_CLUSTER)
              namespace: production
              command: upgrade
              chartType: FilePath
              chartPath: $(CHART_PATH)
              releaseName: flask-web-prod
              valueFile: flask-app/values-production.yaml
              overrideValues: |
                image.repository=$(ACR_NAME).azurecr.io/$(IMAGE_REPOSITORY)
                image.tag=$(Build.SourceVersion)
                application.message=$(flask-demo-message)
              arguments: >-
                --install
                --atomic
                --wait
                --timeout 5m
                --history-max 10

# -------------------------
# Verify production
# -------------------------
- stage: VerifyProduction
  displayName: Verify Production
  dependsOn: DeployProduction
  condition: succeeded()

  jobs:
  - job: ProductionSmokeTest
    displayName: Run production smoke tests

    steps:
    - task: AzureCLI@2
      displayName: Test production application
      inputs:
        azureSubscription: azure-devops-connection
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          az aks get-credentials \
            --resource-group $(AKS_RESOURCE_GROUP) \
            --name $(AKS_CLUSTER) \
            --overwrite-existing

          echo "Waiting for production rollout..."

          kubectl rollout status \
            deployment/flask-web-prod-flask-app \
            --namespace production \
            --timeout=180s

          EXTERNAL_IP=""

          for attempt in {1..30}; do
            EXTERNAL_IP=$(kubectl get service \
              flask-web-prod-flask-app \
              --namespace production \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$EXTERNAL_IP" ]; then
              break
            fi

            echo "Production external IP not ready. Attempt $attempt/30..."
            sleep 10
          done

          if [ -z "$EXTERNAL_IP" ]; then
            echo "ERROR: Production service did not receive an external IP."
            kubectl get all --namespace production
            exit 1
          fi

          echo "Testing production health endpoint..."

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "http://$EXTERNAL_IP/health"; then
              echo
              echo "Production smoke test passed."
              exit 0
            fi

            echo "Production endpoint not ready. Attempt $attempt/12..."
            sleep 10
          done

          echo "ERROR: Production smoke test failed."
          kubectl get pods,services,deployments --namespace production
          exit 1
